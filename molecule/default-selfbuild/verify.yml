---
- name: Verify Changedetection.io systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for Changedetection.io service to become active (up to 180s)
      ansible.builtin.systemd:
        name: changedetection.service
      register: changedetection_service
      until: changedetection_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert Changedetection.io service is active
      ansible.builtin.assert:
        that: changedetection_service.status.ActiveState == 'active'
        fail_msg: "changedetection.service not active ({{ changedetection_service.status.ActiveState }})"
        success_msg: "changedetection.service is active"

    - name: Retrieve Changedetection.io service log for debugging
      when: changedetection_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu changedetection.service
      changed_when: false

    # A self-built Changedetection.io that cannot load its datastore still
    # listens on this port, but answers 500 here, so only a rendered watch list
    # says that the image built from source actually runs. Redirects are not
    # followed, so that a future login redirect cannot be mistaken for one.
    - name: Wait for the self-built Changedetection.io to serve the watch list (up to 10m)
      ansible.builtin.uri:
        url: "http://127.0.0.1:5000/"
        method: GET
        status_code: [200]
        follow_redirects: none
        return_content: true
      register: changedetection_endpoint
      until: changedetection_endpoint.status == 200
      retries: 120
      delay: 5

    - name: Assert the self-built Changedetection.io web interface rendered
      ansible.builtin.assert:
        that: "'<title>Change Detection</title>' in changedetection_endpoint.content"
        fail_msg: "The self-built Changedetection.io did not render its watch list"
        success_msg: "The self-built Changedetection.io serves its watch list"

    - name: Show Changedetection.io systemd service status summary
      ansible.builtin.debug:
        msg:
          - "Changedetection.io systemd: {{ changedetection_service.status.ActiveState }}"
          - "Changedetection.io HTTP: {{ changedetection_endpoint.status }}"

---
- name: Verify Changedetection.io
  hosts: all
  become: true
  gather_facts: false

  vars:
    changedetection_verify_base_url: "http://127.0.0.1:{{ changedetection_molecule_http_bind_port }}"

    # `changedetection_data_path`, which the role bind-mounts into the
    # container at `/datastore`. Spelled out here because the role's own
    # default for it is a Jinja expression over other defaults, and the role
    # is not included in this play, so those are not in scope.
    changedetection_verify_data_path: /changedetection/data

    # Changedetection.io writes its whole configuration - the generated API
    # access token included - into this single file on the data volume.
    changedetection_verify_datastore_file_path: "{{ changedetection_verify_data_path }}/changedetection.json"

    # `changedetection_container_network`, spelled out for the same reason.
    changedetection_verify_container_network: changedetection

    # A throwaway HTTP server started on that network below, giving the watch
    # created through the API something local to fetch. Watching a page on the
    # internet would make this test depend on the internet and on that page.
    changedetection_verify_target_container_name: changedetection-molecule-whoami
    changedetection_verify_target_url: "http://{{ changedetection_verify_target_container_name }}/"

  tasks:
    - name: Run the checks shared by all Changedetection.io scenarios
      ansible.builtin.include_tasks:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

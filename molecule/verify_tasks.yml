---
# The role is not included in this playbook, so its defaults are not in
# scope. Reading defaults/main.yml directly ties the version assertion
# below.
- name: Load the role defaults
  ansible.builtin.include_vars:
    file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
    name: changedetection_defaults

- name: Wait for Changedetection.io service to become active (up to 180s)
  ansible.builtin.systemd:
    name: changedetection.service
  register: changedetection_service
  until: changedetection_service.status.ActiveState == 'active'
  retries: 36
  delay: 5

- name: Assert Changedetection.io service is active
  ansible.builtin.assert:
    that: changedetection_service.status.ActiveState == 'active'
    fail_msg: "changedetection.service not active ({{ changedetection_service.status.ActiveState }})"
    success_msg: "changedetection.service is active"

- name: Retrieve Changedetection.io service log for debugging
  when: changedetection_debug_service_enabled | bool
  ansible.builtin.command:
    cmd: journalctl -xeu changedetection.service
  changed_when: false

# The watch list is the application's own page, rendered from the datastore
# on the mounted volume. A Changedetection.io that cannot read that
# datastore still listens on this port, but answers 500 here - so a
# rendered page is what tells a serving instance apart from a merely
# running container. Redirects are not followed, so that a future login
# redirect cannot be mistaken for a served watch list.
- name: Wait for the Changedetection.io web interface to serve the watch list (up to 300s)
  ansible.builtin.uri:
    url: "{{ changedetection_verify_base_url }}/"
    method: GET
    status_code: [200]
    follow_redirects: none
    return_content: true
  register: changedetection_web
  until: changedetection_web.status == 200
  retries: 60
  delay: 5

- name: Assert the Changedetection.io web interface rendered
  ansible.builtin.assert:
    that: "'<title>Change Detection</title>' in changedetection_web.content"
    fail_msg: "The Changedetection.io web interface did not render its watch list"
    success_msg: "Changedetection.io serves its watch list"

# Changedetection.io generates an API access token on first start and
# stores it in the datastore, inside the directory the role bind-mounts.
# Finding it there proves that the mount is writable by the container user
# the role runs as, and gives the rest of this play access to the API.
- name: Wait for Changedetection.io to write its datastore to the data volume (up to 120s)
  ansible.builtin.stat:
    path: "{{ changedetection_verify_datastore_file_path }}"
  register: changedetection_datastore_file
  until: changedetection_datastore_file.stat.exists | default(false)
  retries: 24
  delay: 5

# Retried on the raw text rather than on parsed JSON, so that reading the
# file while Changedetection.io is halfway through rewriting it retries
# instead of raising.
- name: Read the Changedetection.io datastore generated on the data volume
  ansible.builtin.slurp:
    src: "{{ changedetection_verify_datastore_file_path }}"
  register: changedetection_datastore
  until: "'api_access_token' in (changedetection_datastore.content | b64decode)"
  retries: 12
  delay: 5

- name: Extract the Changedetection.io API access token from the datastore
  ansible.builtin.set_fact:
    changedetection_verify_api_key: >-
      {{ (changedetection_datastore.content | b64decode | from_json).settings.application.api_access_token }}

- name: Assert an API access token was generated on the data volume
  ansible.builtin.assert:
    that: changedetection_verify_api_key | length > 0
    fail_msg: "No API access token found in {{ changedetection_verify_datastore_file_path }}"
    success_msg: "Changedetection.io generated its datastore on the mounted data volume"

# Tying the running version to `changedetection_version` is what makes this
# scenario a real test of the version that Renovate bumps: a bump that
# produces an unusable image cannot pass here.
- name: Query the Changedetection.io system information
  ansible.builtin.uri:
    url: "{{ changedetection_verify_base_url }}/api/v1/systeminfo"
    method: GET
    headers:
      x-api-key: "{{ changedetection_verify_api_key }}"
    status_code: [200]
    return_content: true
  register: changedetection_systeminfo

# Changedetection.io reports its version without a leading `v` (`0.55.8`),
# the same way the role's version variable does. Compared as a prefix, with
# any leading `v` normalized away on both sides, so that this keeps holding
# if either side ever starts carrying one or a build suffix.
- name: Assert the running Changedetection.io is the version this role installs
  ansible.builtin.assert:
    that: >-
      (changedetection_systeminfo.json.version | regex_replace('^v', '')).startswith(
        changedetection_defaults.changedetection_version | regex_replace('^v', '')
      )
    fail_msg: >-
      Changedetection.io reports {{ changedetection_systeminfo.json.version | default('no version') }},
      but the role asks for {{ changedetection_defaults.changedetection_version }}
    success_msg: "Changedetection.io reports version {{ changedetection_systeminfo.json.version }}"

# Watching a page for changes is the one thing this role exists to deploy,
# and none of the probes above exercise it: the fetcher is a separate
# worker that has to resolve the target over the role's container network,
# fetch it, and write a snapshot back to the data volume.
#
# Started through the docker CLI rather than community.docker, whose
# modules are not available to the ansible-lint environment used by
# pre-commit and would fail the playbook syntax check there.
- name: Start a throwaway HTTP server on the Changedetection.io container network
  ansible.builtin.command:
    cmd: >-
      docker run --detach --rm
      --name={{ changedetection_verify_target_container_name }}
      --network={{ changedetection_verify_container_network }}
      docker.io/traefik/whoami:latest
  changed_when: true

- name: Create a watch for that server through the Changedetection.io API
  ansible.builtin.uri:
    url: "{{ changedetection_verify_base_url }}/api/v1/watch"
    method: POST
    headers:
      x-api-key: "{{ changedetection_verify_api_key }}"
    body_format: json
    body:
      url: "{{ changedetection_verify_target_url }}"
      title: molecule
    status_code: [201]
    return_content: true
  register: changedetection_watch_creation
  changed_when: true

- name: Wait for Changedetection.io to check the watch (up to 180s)
  ansible.builtin.uri:
    url: "{{ changedetection_verify_base_url }}/api/v1/watch/{{ changedetection_watch_creation.json.uuid }}"
    method: GET
    headers:
      x-api-key: "{{ changedetection_verify_api_key }}"
    status_code: [200]
    return_content: true
  register: changedetection_watch
  until: (changedetection_watch.json.last_checked | default(0)) > 0
  retries: 36
  delay: 5

# `last_error` carries the errors Changedetection.io itself reports about a
# check - an HTTP error status, or its refusal to fetch a private address.
# It is deliberately not the only thing asserted about the check: a target
# that does not resolve at all leaves `last_error` at `false` while still
# bumping `last_checked`, and only the empty snapshot history below gives
# that away.
- name: Assert Changedetection.io reported no error for the watched page
  ansible.builtin.assert:
    that: not (changedetection_watch.json.last_error | default('never checked'))
    fail_msg: "Changedetection.io could not check the watch: {{ changedetection_watch.json.last_error | default('no result') }}"
    success_msg: "Changedetection.io checked the watch it was given"

# The snapshot is written to a file under the watch's own directory on the
# data volume, so the history says both that a snapshot exists and where on
# the mounted volume it landed. A check that fetched nothing leaves this
# empty, which is what makes it - rather than `last_error` - the probe that
# a watch really was fetched.
- name: Wait for Changedetection.io to store a snapshot of the watched page (up to 60s)
  ansible.builtin.uri:
    url: "{{ changedetection_verify_base_url }}/api/v1/watch/{{ changedetection_watch_creation.json.uuid }}/history"
    method: GET
    headers:
      x-api-key: "{{ changedetection_verify_api_key }}"
    status_code: [200]
    return_content: true
  register: changedetection_history
  until: (changedetection_history.json | length) > 0
  retries: 12
  delay: 5

- name: Assert Changedetection.io stored a snapshot of the watched page
  ansible.builtin.assert:
    that: (changedetection_history.json | length) > 0
    fail_msg: "Changedetection.io stored no snapshot for {{ changedetection_verify_target_url }}"
    success_msg: "Changedetection.io stored a snapshot of the page it watched"

- name: Retrieve the latest snapshot of the watch
  ansible.builtin.uri:
    url: "{{ changedetection_verify_base_url }}/api/v1/watch/{{ changedetection_watch_creation.json.uuid }}/history/latest"
    method: GET
    headers:
      x-api-key: "{{ changedetection_verify_api_key }}"
    status_code: [200]
    return_content: true
  register: changedetection_snapshot

# The throwaway server echoes the request it received, so its own view of
# the `Host` header proves the snapshot is of the page Changedetection.io
# was asked to watch, and not an error page or some other watch.
- name: Assert the snapshot is of the watched page
  ansible.builtin.assert:
    that: "('Host: ' ~ changedetection_verify_target_container_name) in changedetection_snapshot.content"
    fail_msg: "Unexpected snapshot content: {{ changedetection_snapshot.content | default('none') }}"
    success_msg: "The stored snapshot is of the page Changedetection.io was asked to watch"

# Closes the loop on the data volume: the path the API reports for the
# snapshot is a path inside the container, and the same file has to be
# there on the host for the bind mount to be doing its job.
- name: Locate the stored snapshot on the host data volume
  ansible.builtin.stat:
    path: >-
      {{ changedetection_verify_data_path }}/{{
        (changedetection_history.json.values() | list | last) | regex_replace('^/datastore/', '')
      }}
  register: changedetection_snapshot_file

- name: Assert the snapshot was stored on the mounted data volume
  ansible.builtin.assert:
    that: changedetection_snapshot_file.stat.exists | default(false)
    fail_msg: "The snapshot reported by the API is not on the data volume ({{ changedetection_history.json }})"
    success_msg: "Changedetection.io stored the snapshot on the mounted data volume"

- name: Show the Changedetection.io verification summary
  ansible.builtin.debug:
    msg:
      - "Changedetection.io systemd: {{ changedetection_service.status.ActiveState }}"
      - "Changedetection.io version: {{ changedetection_systeminfo.json.version }}"
      - "Changedetection.io watches: {{ changedetection_systeminfo.json.watch_count }}"
      - "Watch created: {{ changedetection_watch_creation.json.uuid }}"
      - "Watch snapshots: {{ changedetection_history.json | length }}"

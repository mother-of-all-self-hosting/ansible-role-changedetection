---
- name: Ensure Changedetection.io systemd services are stopped and removed
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/remove_service.yml"
  with_items:
    - service: "{{ changedetection_identifier }}.service"
      path: "{{ devture_systemd_docker_base_systemd_path }}/{{ changedetection_identifier }}.service"
    # Legacy bundled services, removed from this role in favor of external instances
    - service: "{{ changedetection_identifier }}-playwright-driver.service"
      path: "{{ devture_systemd_docker_base_systemd_path }}/{{ changedetection_identifier }}-playwright-driver.service"

- name: Ensure Changedetection.io support files do not exist
  ansible.builtin.file:
    path: "{{ changedetection_base_path }}/{{ item }}"
    state: absent
  with_items:
    - env
    - labels

- name: Ensure Changedetection.io local data path does not exist if empty
  ansible.builtin.command:
    cmd: "rmdir {{ changedetection_data_path }}"
  register: changedetection_data_path_deletion_result
  changed_when: changedetection_data_path_deletion_result.rc == 0
  failed_when: false

- name: Ensure Changedetection.io base path does not exist if empty
  ansible.builtin.command:
    cmd: "rmdir {{ changedetection_base_path }}"
  register: changedetection_base_path_deletion_result
  changed_when: changedetection_base_path_deletion_result.rc == 0
  failed_when: false

- name: Ensure Changedetection.io container network does not exist
  when: changedetection_container_network_deletion_enabled and changedetection_container_network != 'host'
  block:
    - name: Ensure Changedetection.io container network does not exist via community.docker.docker_network
      when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
      community.docker.docker_network:
        name: "{{ changedetection_container_network }}"
        state: absent
      register: changedetection_network_deletion_result

    - name: Ensure Changedetection.io container network does not exist via ansible.builtin.command
      when: devture_systemd_docker_base_container_network_creation_method == 'command'
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }} network rm
          {{ changedetection_container_network }}
      register: changedetection_network_deletion_result
      changed_when: changedetection_container_network in changedetection_network_deletion_result.stdout

- name: Check existence of Changedetection.io local data path
  ansible.builtin.stat:
    path: "{{ changedetection_data_path }}"
  register: changedetection_data_path_stat

# We just want to notify the user. Deleting data is too destructive.
- name: Inject the message about the remaining Changedetection.io local data path
  when: changedetection_data_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: As the local Changedetection.io instance has been removed, some old data remains in `" + changedetection_data_path + "`. Feel free to delete it."
        ]
      }}

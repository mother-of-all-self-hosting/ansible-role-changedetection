---
# Determines whether the currently running Changedetection.io container is stale,
# i.e. it was created from an older version of its configuration (env file, labels, systemd unit) or from an older image.
#
# A container's configuration is frozen at creation time, so changes to these files only take effect after a restart.
# If a previous run changed them but did not manage to restart the service (e.g. because it failed midway),
# subsequent runs would not see any changes and would never restart the service on their own.
#
# Sets `changedetection_container_stale` (bool).

- name: Inspect Changedetection.io container
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} inspect --type=container {{ changedetection_identifier }}"
  register: changedetection_container_staleness_container_inspect_result
  changed_when: false
  failed_when: false
  check_mode: false
  # The output contains the container's environment variables, which include secrets.
  no_log: true

- name: Determine Changedetection.io container facts
  vars:
    container: "{{ (changedetection_container_staleness_container_inspect_result.stdout | from_json | first) if changedetection_container_staleness_container_inspect_result.rc == 0 else {} }}"
    # `Created` looks like `2026-01-02T03:04:05.123456789Z` (always UTC, trailing zeros in the fractional part may be omitted).
    container_created: "{{ container.Created | default('1970-01-01T00:00:00Z') }}"
    container_created_fraction: "{{ container_created | regex_search('\\.([0-9]+)', '\\1') | default([], true) | first | default('0') }}"
  ansible.builtin.set_fact:
    changedetection_container_staleness_container_running: "{{ container.State.Running | default(false) | bool }}"
    changedetection_container_staleness_container_created_timestamp: >-
      {{
        ((container_created[:19] ~ '+0000') | to_datetime('%Y-%m-%dT%H:%M:%S%z')).timestamp() | int
        + ('0.' ~ container_created_fraction[:6]) | float
      }}
    changedetection_container_staleness_container_image_id: "{{ container.Image | default('') }}"

- name: Inspect Changedetection.io container image and files, if the container is running
  when: changedetection_container_staleness_container_running | bool
  block:
    - name: Inspect Changedetection.io container image
      vars:
        # The same image that the systemd service creates the container from.
        image: "{{ changedetection_container_image_self_build_name if changedetection_container_image_self_build else changedetection_container_image }}"
      ansible.builtin.command:
        cmd: "{{ devture_systemd_docker_base_host_command_docker }} image inspect --format={{ '{{' }}.Id{{ '}}' }} {{ image }}"
      register: changedetection_container_staleness_image_inspect_result
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Check Changedetection.io files that affect the container
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      register: changedetection_container_staleness_file_stat_results
      loop:
        - "{{ changedetection_base_path }}/env"
        - "{{ changedetection_base_path }}/labels"
        - "{{ devture_systemd_docker_base_systemd_path }}/{{ changedetection_identifier }}.service"

- name: Determine whether Changedetection.io container is stale
  ansible.builtin.set_fact:
    changedetection_container_stale: >-
      {{
        changedetection_container_staleness_container_running | bool
        and (
          (
            changedetection_container_staleness_image_inspect_result.rc == 0
            and changedetection_container_staleness_image_inspect_result.stdout | trim != changedetection_container_staleness_container_image_id
          )
          or
          (
            changedetection_container_staleness_file_stat_results.results
            | selectattr('stat.exists')
            | map(attribute='stat.mtime')
            | map('float')
            | select('gt', changedetection_container_staleness_container_created_timestamp | float)
            | list
            | length > 0
          )
        )
      }}
